<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Something tripped — VoltPro Electrodata Solutions</title>
<link rel="icon" type="image/svg+xml" href="/static/core/images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#032B7A; --accent:#FFCC00; --accent-on:#0B1220;
    --bg:#F6F6F2; --line:#DFE1DA; --text:#16202E; --text-muted:#5C6675;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--bg); color: var(--text); padding: 28px;
    font-family:"Plus Jakarta Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width: 520px; text-align:center; }
  .badge{
    width:64px; height:64px; margin:0 auto 26px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#0B3E9E 0%,var(--primary) 55%,#02194a 100%);
    box-shadow:0 16px 40px rgba(3,43,122,.28);
  }
  .badge svg{ width:30px; height:30px; }
  .eyebrow{
    font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11.5px; letter-spacing:.13em;
    text-transform:uppercase; color:#8A6A00; margin:0 0 12px; font-weight:600;
  }
  h1{ font-size:clamp(30px,6vw,44px); line-height:1.1; letter-spacing:-.02em; margin:0 0 14px; color:var(--primary); }
  p{ color:var(--text-muted); font-size:16px; line-height:1.65; margin:0 0 28px; }
  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:12px 22px;
    border-radius:10px; font-size:14.5px; font-weight:700; text-decoration:none; transition:transform .2s ease, box-shadow .2s ease;
  }
  a.btn:hover{ transform:translateY(-2px); }
  .btn-solid{ background:var(--accent); color:var(--accent-on); box-shadow:0 10px 24px rgba(255,204,0,.35); }
  .btn-line{ border:1px solid var(--line); color:var(--primary); background:#FFFFFF; }
  .foot{ margin-top:30px; font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text-muted); }
</style>
</head>
<body>
  <main class="wrap">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/>
      </svg>
    </div>
    <p class="eyebrow">Error 500 &middot; Tripped, not broken</p>
    <h1>Something went wrong on our end</h1>
    <p>This request didn't complete. The site is otherwise unaffected &mdash; reload in a moment, or call us directly if it's urgent and it concerns a live installation.</p>
    <div class="actions">
      <a class="btn btn-solid" href="/">Back to VoltPro</a>
      <a class="btn btn-line" href="tel:+254715117855">Call 0715 117855</a>
    </div>
    <p class="foot">VoltPro Electrodata Solutions &middot; Nairobi</p>
  </main>
</body>
</html>
