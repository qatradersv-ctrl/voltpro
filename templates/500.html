<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something tripped — VoltPro Electrodata Solutions</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%230B1220'/%3E%3Cpolygon points='20,3 36,11 36,29 20,37 4,29 4,11' fill='none' stroke='%23F5A623' stroke-width='2'/%3E%3Cpath d='M22 9 L13 21 L19 21 L17 31 L28 18 L21 18 Z' fill='%23F5A623'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B1220; --bg-panel:#101A2C; --line:#26374F; --amber:#F5A623; --danger:#E0563F; --text:#E9EEF5; --text-muted:#90A0B7; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--bg); color: var(--text); font-family:"Inter",sans-serif; text-align:center; padding: 24px;
  }
  .wrap{ max-width: 420px; }
  .eyebrow{ font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--danger); margin-bottom:14px; }
  h1{ font-family:"Space Grotesk",sans-serif; font-size:clamp(38px,9vw,52px); margin:0 0 10px; line-height:1.1; }
  p{ color:var(--text-muted); font-size:15px; margin:0 0 28px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; padding:12px 22px; border-radius:4px;
    font-family:"JetBrains Mono",monospace; font-size:14px; background:var(--amber); color:#16130a; font-weight:500; text-decoration:none;
  }
  .diagram{ margin: 0 auto 28px; width:64px; height:64px; border:1px solid var(--danger); border-radius:6px; background:var(--bg-panel); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="diagram" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 40 40"><polygon points="20,1 38,10.5 38,29.5 20,39 2,29.5 2,10.5" fill="none" stroke="#E0563F" stroke-width="2"/><path d="M22 8 L12 21 L19 21 L17 32 L29 17 L21 17 Z" fill="#E0563F"/></svg>
    </div>
    <p class="eyebrow">Error 500</p>
    <h1>Something tripped on our end</h1>
    <p>Our team's been notified. Try again in a moment, or call us directly if it's urgent.</p>
    <a class="btn" href="/">Back to VoltPro</a>
  </div>
</body>
</html>
