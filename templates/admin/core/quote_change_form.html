{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Move inline formsets after the first fieldset
    const inlineFormsets = document.querySelectorAll('.inline-group');
    const fieldsets = document.querySelectorAll('.module');
    
    if (inlineFormsets.length > 0 && fieldsets.length > 0) {
        // Insert the first inline formset after the first fieldset
        fieldsets[0].after(inlineFormsets[0]);
        
        // Move collapsed sections (Scope & Terms, Totals & Sharing, System Info) after inline formsets
        for (let i = 1; i < fieldsets.length; i++) {
            if (fieldsets[i].classList.contains('collapsed')) {
                inlineFormsets[0].after(fieldsets[i]);
            }
        }
    }
});
</script>
{% endblock %}
